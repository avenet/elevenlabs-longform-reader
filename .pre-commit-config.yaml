repos:
  - repo: local
    hooks:
      - id: make-fmt
        name: make fmt
        entry: make fmt
        language: system
        pass_filenames: false
        always_run: true
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
      - id: make-test
        name: make test-unit
        entry: make test-unit
        language: system
        pass_filenames: false
        always_run: true
